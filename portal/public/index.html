<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeepSeek Harness Portal</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- toast notifications -->
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <!-- generic modal root -->
  <div id="modal-root" class="modal-root hidden"></div>

  <!-- ===================== AUTH ===================== -->
  <div id="auth-view" class="auth-wrap hidden">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="brand-mark">◈</span>
        <div>
          <div class="brand-name">DeepSeek Harness</div>
          <div class="brand-sub">Portal</div>
        </div>
      </div>

      <div class="segmented" role="tablist">
        <button id="tab-login" class="seg" role="tab">Log in</button>
        <button id="tab-register" class="seg" role="tab">Register</button>
      </div>

      <!-- password login -->
      <form id="login-form" class="form" novalidate>
        <div class="field">
          <label for="login-username">Username or email</label>
          <input id="login-username" name="username" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <div class="pw-row">
            <input id="login-password" name="password" type="password" autocomplete="current-password" required />
            <button type="button" class="pw-toggle" data-pw="login-password" title="Show password"><span class="nav-icon" data-icon="eye"></span></button>
          </div>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Log in</button>
        <button type="button" id="login-via-otp" class="link">Email me a code instead</button>
      </form>

      <!-- OTP login -->
      <form id="login-otp-form" class="form hidden" novalidate>
        <div class="field">
          <label for="login-otp-email">Email</label>
          <input id="login-otp-email" name="email" type="email" autocomplete="email" required />
        </div>
        <div class="field hidden" id="login-otp-code-row">
          <label for="login-otp-code">6-digit code</label>
          <input id="login-otp-code" name="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" />
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="login-otp-submit">Send code</button>
        <button type="button" id="login-otp-back" class="link">Back to password login</button>
      </form>

      <!-- registration -->
      <form id="register-form" class="form hidden" novalidate>
        <div class="field">
          <label for="reg-email">Email</label>
          <input id="reg-email" name="email" type="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="reg-name">Name <span class="opt">(optional — used for your subdomain)</span></label>
          <input id="reg-name" name="name" autocomplete="name" />
        </div>
        <div class="field">
          <label for="reg-username">Username <span class="opt">(optional — used to log in)</span></label>
          <input id="reg-username" name="username" autocomplete="username" />
        </div>
        <div class="field">
          <label for="reg-password">Password <span class="opt">(optional — set it now to log in with it)</span></label>
          <div class="pw-row">
            <input id="reg-password" name="password" type="password" autocomplete="new-password" />
            <button type="button" class="pw-toggle" data-pw="reg-password" title="Show password"><span class="nav-icon" data-icon="eye"></span></button>
          </div>
        </div>
        <div class="field hidden" id="register-invite-row">
          <label for="reg-invite">Invitation code</label>
          <input id="reg-invite" name="inviteCode" autocomplete="off" />
        </div>
        <div class="field hidden" id="register-otp-row">
          <label for="reg-otp">6-digit code</label>
          <input id="reg-otp" name="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" />
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="register-submit">Send code</button>
      </form>

      <p id="auth-msg" class="form-msg" role="alert"></p>
    </div>
  </div>

  <!-- ===================== APP ===================== -->
  <div id="app-view" class="app hidden">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark">◈</span>
        <span class="brand-name">Portal</span>
      </div>
      <nav class="nav" id="admin-nav">
        <button class="nav-item" data-tab="instances">
          <span class="nav-icon" data-icon="server"></span> Instances
        </button>
        <button class="nav-item" data-tab="users">
          <span class="nav-icon" data-icon="users"></span> Users
        </button>
        <button class="nav-item" data-tab="settings">
          <span class="nav-icon" data-icon="sliders"></span> Settings
        </button>
      </nav>
      <div class="sidebar-foot">
        <button class="nav-item" id="profile-btn">
          <span class="nav-icon" data-icon="user"></span> Profile
        </button>
        <form class="logout-form" method="post" action="/api/auth/logout">
          <input class="csrf-token" type="hidden" name="_csrf" />
          <button class="nav-item" type="submit">
            <span class="nav-icon" data-icon="logout"></span> Log out
          </button>
        </form>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <h1 id="topbar-title">Overview</h1>
        <div class="topbar-right">
          <button class="btn btn-ghost" id="refresh-btn" title="Refresh">
            <span class="nav-icon" data-icon="refresh"></span>
          </button>
          <span id="whoami" class="whoami"></span>
        </div>
      </header>

      <nav id="mobile-nav" class="mobile-nav">
        <div class="mobile-admin-nav" id="mobile-admin-nav">
          <button class="nav-item" data-tab="instances">
            <span class="nav-icon" data-icon="server"></span> Instances
          </button>
          <button class="nav-item" data-tab="users">
            <span class="nav-icon" data-icon="users"></span> Users
          </button>
          <button class="nav-item" data-tab="settings">
            <span class="nav-icon" data-icon="sliders"></span> Settings
          </button>
        </div>
        <button class="nav-item" id="mobile-profile-btn">
          <span class="nav-icon" data-icon="user"></span> Profile
        </button>
        <form class="logout-form" method="post" action="/api/auth/logout">
          <input class="csrf-token" type="hidden" name="_csrf" />
          <button class="nav-item" type="submit">
            <span class="nav-icon" data-icon="logout"></span> Log out
          </button>
        </form>
      </nav>

      <main class="content">
        <!-- user view -->
        <section id="user-view" class="hidden">
          <div id="instance-card" class="panel">
            <p id="instance-empty" class="empty">No instance provisioned yet.</p>
            <div id="instance-body" class="hidden">
              <div class="instance-head">
                <div>
                  <div class="instance-name" id="i-slug">—</div>
                  <div class="instance-url-row">
                    <a id="i-url" class="instance-url" target="_blank" rel="noopener"></a>
                    <button class="btn btn-ghost btn-sm" id="i-copy" title="Copy URL"><span class="nav-icon" data-icon="copy"></span></button>
                  </div>
                </div>
                <div id="i-status" class="instance-status"></div>
              </div>
              <div class="kv-grid">
                <div class="kv"><span class="k">Requests</span><span class="v" id="i-requests">0</span></div>
                <div class="kv"><span class="k">Last active</span><span class="v" id="i-active">—</span></div>
              </div>
              <p id="i-error" class="form-msg err"></p>
              <div class="actions">
                <a id="i-launch" class="btn btn-primary" target="_blank" rel="noopener">
                  <span class="nav-icon" data-icon="play"></span> Launch
                </a>
              </div>
              <p class="hint">Your DeepSeek API key is set inside your instance (Settings → Models) and lives in that instance only. Idle instances pause automatically and wake on launch.</p>
            </div>
          </div>
        </section>

        <!-- admin view -->
        <section id="admin-view" class="hidden">
          <div class="stat-grid" id="admin-stats"></div>

          <div class="panel" id="panel-instances">
            <div class="panel-head">
              <h2>Instances</h2>
              <div class="panel-tools">
                <input id="search-instances" class="input input-search" type="search" placeholder="Search…" />
              </div>
            </div>
            <div id="instances-table"></div>
          </div>

          <div class="panel hidden" id="panel-users">
            <div class="panel-head">
              <h2>Users</h2>
              <div class="panel-tools">
                <input id="search-users" class="input input-search" type="search" placeholder="Search…" />
              </div>
            </div>
            <div id="users-table"></div>
          </div>

          <div class="panel hidden" id="panel-settings">
            <h2>Settings</h2>
            <form id="settings-form" class="form form-narrow">
              <div class="field">
                <label for="set-domains">Allowed email domains <span class="opt">(comma-separated; empty = allow all)</span></label>
                <input id="set-domains" name="emailDomains" placeholder="company.com, gmail.com" />
              </div>
              <div class="field">
                <label for="set-invite">Invitation code <span class="opt">(optional; empty = open registration)</span></label>
                <div class="input-row">
                  <input id="set-invite" name="inviteCode" autocomplete="off" placeholder="leave blank to disable" />
                  <button type="button" class="btn btn-ghost" id="gen-invite" title="Generate">Generate</button>
                  <button type="button" class="btn btn-ghost" id="copy-invite" title="Copy"><span class="nav-icon" data-icon="copy"></span></button>
                </div>
              </div>
              <label class="check"><input type="checkbox" name="otpRegistrationEnabled" /> Allow new registrations (email OTP)</label>
              <label class="check"><input type="checkbox" name="passwordLoginEnabled" /> Allow password login</label>
              <button class="btn btn-primary" type="submit">Save settings</button>
            </form>
            <p id="settings-msg" class="form-msg"></p>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
